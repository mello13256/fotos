name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes, APK de depuração e lint
        run: ./gradlew --no-daemon :core:model:test :app:assembleDebug :app:lintDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: fotos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK na release "debug"
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk fotos-debug.apk
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug fotos-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Fotos (depuração)" \
            --notes "APK de depuração gerado automaticamente a partir de ${GITHUB_SHA::7} (ramo ${GITHUB_REF_NAME})."

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            core/model/build/reports/
          if-no-files-found: ignore
